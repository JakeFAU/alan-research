name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CGO_ENABLED: '1'
  GOTOOLCHAIN: local
  GOWORK: 'off'
  GOFLAGS: -mod=readonly -buildvcs=false
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  checks:
    name: PR checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: go.sum
      - name: Install Staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - name: Check source and smoke tests
        run: python3 scripts/ci/check.py pr 2>&1 | tee "$RUNNER_TEMP/pr.log"
      - name: Retain check log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr.log
          retention-days: 14
